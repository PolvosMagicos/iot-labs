services:
  mosquitto:
    image: docker.io/eclipse-mosquitto:2
    container_name: iot-mosquitto
    network_mode: host
    volumes:
      - ./config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped

  influxdb:
    image: docker.io/library/influxdb:1.8
    container_name: iot-influxdb
    network_mode: host
    environment:
      - INFLUXDB_DB=iot_lab
    volumes:
      - influxdb-data:/var/lib/influxdb
    restart: unless-stopped

  node-red:
    image: docker.io/nodered/node-red:latest
    container_name: iot-node-red
    network_mode: host
    volumes:
      - node-red-data:/data
    depends_on:
      - mosquitto
      - influxdb
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana-oss:latest
    container_name: iot-grafana
    network_mode: host
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb
    restart: unless-stopped

volumes:
  mosquitto-data:
  mosquitto-log:
  influxdb-data:
  node-red-data:
  grafana-data:
