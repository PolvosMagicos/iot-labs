[package]
name = "iot-lab10-backend"
version = "0.1.0"
edition = "2021"
default-run = "iot-lab10-backend"

[dependencies]
aes-gcm = "0.11.0"
anyhow = "1.0.103"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
html-escape = "0.2.14"
jsonwebtoken = {
    version = "10.4",
    default-features = false,
    features = ["rust_crypto", "use_pem"]
}
p256 = { version = "0.14.0", features = ["ecdh"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "query", "rustls"] }
getrandom = "0.4.3"
rumqttc = "0.25.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"


[[bin]]
name = "keygen"
path = "src/bin/keygen.rs"
