[package]
name = "iot-lab10-esp32"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
aes-gcm = "0.11.0"
anyhow = "1.0.103"
base64 = "0.22.1"
esp-idf-svc = "0.52.1"
log = "0.4.33"
p256 = { version = "0.14", features = ["ecdh"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"

[build-dependencies]
embuild = "0.33.1"
dotenvy = "0.15.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
